[package]
name = "orbital-compiler"
version = "19.0.0"
edition = "2021"
license = "MIT"
description = "Compiler for Orbital schemas to Rust code"

[dependencies]
orbital-core-base = { git = "https://github.com/almadar-io/orbital-core", branch = "main" }
orbital-core-eval = { git = "https://github.com/almadar-io/orbital-core", branch = "main" }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["float_roundtrip", "preserve_order"] }
thiserror = "1.0"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"

[build-dependencies]
syn = { version = "2", features = ["full"] }

[dev-dependencies]
pretty_assertions = "1.4"
tempfile = "3.10"
orbital-test-support = { package = "orbital-integration-tests", git = "https://github.com/almadar-io/orbital-integration-tests", branch = "main" }

[[bin]]
name = "compose_only"
path = "src/bin/compose_only.rs"
