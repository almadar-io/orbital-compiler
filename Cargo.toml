[package]
name = "orbital-compiler"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Compiler for Orbital schemas to Rust code"

[dependencies]
orbital-core = { path = "../orbital-core" }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true
regex = "1.10"
phf = { version = "0.11", features = ["macros"] }
# Pure-Rust (miniz_oxide) gzip for the baked registries — wasm32-safe, no C
# toolchain. The corpus embeds as .gz (build.rs) and inflates lazily.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[build-dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
pretty_assertions.workspace = true
tempfile = "3.10"

[[bin]]
name = "compose_only"
path = "src/bin/compose_only.rs"
