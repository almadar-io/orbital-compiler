[package]
name = "orbital-compiler"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Compiler for Orbital schemas to Rust code"

[dependencies]
orbital-core-base = { path = "../orbital-core/crates/base" }
orbital-core-eval = { path = "../orbital-core/crates/eval" }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true
regex = "1.10"

[build-dependencies]
syn = { version = "2", features = ["full"] }

[dev-dependencies]
pretty_assertions.workspace = true
tempfile = "3.10"
orbital-test-support = { package = "orbital-integration-tests", path = "../orbital-integration-tests" }

[[bin]]
name = "compose_only"
path = "src/bin/compose_only.rs"
